<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xegesis</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1f1d1a; --muted: #6b665e; --line: #e2ddd3; --accent: #7a4b1e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --fg: #ece8e1; --muted: #a39d93; --line: #34312c; --accent: #e0a868; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg);
         display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); overflow: auto; }
  aside input { width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line);
                background: transparent; color: inherit; font: inherit; }
  aside button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0;
                 background: none; color: inherit; font: inherit; cursor: pointer; }
  aside button:hover, aside button.on { background: var(--line); }
  aside small { display: block; color: var(--muted); }
  main { padding: 20px 24px; overflow: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sum { color: var(--muted); margin: 0 0 16px; }
  textarea, pre { width: 100%; font: 13px/1.45 ui-monospace, monospace; border: 1px solid var(--line);
                  border-radius: 6px; padding: 10px; background: transparent; color: inherit; }
  textarea { min-height: 120px; }
  pre { white-space: pre-wrap; min-height: 80px; }
  .run { margin: 10px 0 16px; padding: 6px 16px; border: 1px solid var(--accent); color: var(--accent);
         background: none; border-radius: 6px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<aside>
  <input id="filter" placeholder="Find a command" aria-label="Find a command">
  <nav id="list"></nav>
</aside>
<main>
  <h1 id="title">Xegesis</h1>
  <p class="sum" id="summary">Choose a command. Everything Xegesis does is a command, here and in the CLI.</p>
  <label for="params">Parameters (JSON)</label>
  <textarea id="params">{}</textarea>
  <button class="run" id="run">Run</button>
  <pre id="out" aria-live="polite"></pre>
</main>
<script>
  const api = () => window.go && window.go.main && window.go.main.App;
  let commands = [], current = null;

  function example(schema) {
    const o = {};
    for (const [k, p] of Object.entries((schema && schema.properties) || {})) {
      if (!(schema.required || []).includes(k)) continue;
      o[k] = p.enum ? p.enum[0] : p.type === "integer" ? 0 : p.type === "object" ? {} : "";
    }
    return JSON.stringify(o, null, 2);
  }

  function render() {
    const q = document.getElementById("filter").value.toLowerCase();
    const nav = document.getElementById("list");
    nav.replaceChildren();
    for (const c of commands) {
      if (q && !(c.id + " " + c.summary).toLowerCase().includes(q)) continue;
      const b = document.createElement("button");
      b.className = c === current ? "on" : "";
      b.textContent = c.id;
      const s = document.createElement("small");
      s.textContent = c.summary;
      b.append(s);
      b.onclick = () => select(c);
      nav.append(b);
    }
  }

  function select(c) {
    current = c;
    document.getElementById("title").textContent = c.id;
    document.getElementById("summary").textContent = c.summary + (c.writes ? " Recorded in history." : "");
    document.getElementById("params").value = example(c.params);
    document.getElementById("out").textContent = JSON.stringify(c.params, null, 2);
    render();
  }

  document.getElementById("filter").oninput = render;
  document.getElementById("run").onclick = async () => {
    const out = document.getElementById("out");
    if (!current) return;
    try {
      const res = await api().Run(current.id, document.getElementById("params").value);
      out.textContent = JSON.stringify(JSON.parse(res), null, 2);
    } catch (e) {
      out.textContent = String(e);
    }
  };

  window.addEventListener("load", async () => {
    if (!api()) { document.getElementById("summary").textContent = "Run this page inside the Xegesis app."; return; }
    commands = await api().Commands();
    render();
  });
</script>
</body>
</html>
